name: Migrate FLEX branches from SQ4KOU-THETIS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror selected FLEX histories
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --mirror https://github.com/SQ4KOU/SQ4KOU-THETIS.git source.git
          cd source.git
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force target refs/heads/flex5000-wdsp-native:refs/heads/baseline/flex5000-wdsp-native
          git push --force target refs/heads/flex5000-hpsdr-isolation-fix:refs/heads/archive/flex5000-hpsdr-isolation-fix
          git push --force target refs/heads/powersdr-flex5000-display:refs/heads/feature/powersdr-flex5000-display
          git push --force target refs/heads/powersdr-flex5000-thetis-ui:refs/heads/feature/powersdr-flex5000-thetis-ui
          echo "FLEX migration complete"
