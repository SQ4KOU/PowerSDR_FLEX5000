name: SQ4KOU P51 port and test MSI on KE9NS v3
on:
  push:
    branches: [feature/ke9ns-v3.0.0.15d-sq4kou-p51]
    paths: [.github/workflows/port-p51-v3.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct exact P51 and perform three-way migration
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:GITHUB_WORKSPACE 'port-audit'
          New-Item -ItemType Directory -Force $log | Out-Null
          $oldSha='d558979570c4c2e4572b63ac218d3d4477926cb8'
          $p51Sha='454489cb218b71fc94104b5390bcd4205ca5eda1'
          $newSha='b37d6ed08813baa32003f840f71aafd032ca13ea'
          $old=Join-Path $env:RUNNER_TEMP 'psdr-old'
          $h=Join-Path $env:RUNNER_TEMP 'psdr-p51'
          $new=Join-Path $env:RUNNER_TEMP 'psdr-port'
          function GitChecked([string[]]$a) {
            & git @a
            if($LASTEXITCODE -ne 0){throw "git failed rc=$LASTEXITCODE : $a"}
          }
          GitChecked @('config','user.name','SQ4KOU migration CI')
          GitChecked @('config','user.email','actions@users.noreply.github.com')
          GitChecked @('config','core.longpaths','true')
          GitChecked @('fetch','--no-tags','--depth=1','origin',$p51Sha)
          GitChecked @('worktree','add','--detach',$h,$p51Sha)
          GitChecked @('fetch','--no-tags','--depth=1','https://github.com/ke9ns/PowerSDR-KE9NS-v2.8.0.git',$oldSha)
          GitChecked @('worktree','add','--detach',$old,$oldSha)
          GitChecked @('fetch','--no-tags','--depth=1','origin',$newSha)
          if((git rev-parse "$newSha^{tree}").Trim() -ne '9155307cfbe157ee7f02ee4837c7f0d6e0c3dad9'){throw 'new upstream tree mismatch'}
          $scripts=Join-Path $h 'tools/powersdr'
          $builder=Get-Content (Join-Path $scripts 'Build-PowerSDR-MSI.ps1') -Raw
          $stageNames=@([regex]::Matches($builder,"'((?:Apply|Verify)-PowerSDR-[^']+\.ps1)'\)\s+-SourceRoot") | ForEach-Object {$_.Groups[1].Value})
          if($stageNames.Count -lt 15){throw 'old patch order extraction incomplete'}
          $stageNames += @('Apply-PowerSDR-ThetisMetersCoherent-P32.ps1','Apply-PowerSDR-MetersPersistence-P48.ps1','Apply-PowerSDR-LegacyItems-P39.ps1','Apply-PowerSDR-TCI-P44.ps1','Apply-PowerSDR-TCI-Streaming-P46.ps1','Apply-PowerSDR-DatabasePersistence-P49.ps1','Apply-PowerSDR-WindowPositions-P50.ps1','Apply-PowerSDR-WindowResize-P51.ps1')
          Push-Location $old
          try {
            foreach($stage in $stageNames){
              Write-Host "[PATCH] $stage"
              & (Join-Path $scripts $stage) -SourceRoot $old
              GitChecked @('add','-A')
              GitChecked @('commit','--allow-empty','-m',"Reconstruct $stage")
              "$stage $((git rev-parse HEAD).Trim())" | Add-Content (Join-Path $log 'stages.txt')
            }
            $oldPatched=(git rev-parse HEAD).Trim()
            GitChecked @('diff','--binary',"--output=$(Join-Path $log 'P51-exact.patch')",$oldSha,$oldPatched)
            git diff --stat $oldSha $oldPatched | Set-Content (Join-Path $log 'P51-file-stat.txt')
          } finally {Pop-Location}
          $newTree=(git rev-parse "$newSha^{tree}").Trim()
          $synthetic=(git commit-tree $newTree -p $oldSha -m 'Synthetic audit: new KE9NS tree on old base').Trim()
          if(!$synthetic -or $LASTEXITCODE -ne 0){throw 'synthetic audit commit failed'}
          GitChecked @('worktree','add','--detach',$new,$synthetic)
          Push-Location $new
          try {
            & git -c merge.conflictStyle=diff3 merge --no-commit --no-ff $oldPatched 2>&1 | Tee-Object -FilePath (Join-Path $log 'merge.log')
            $mergeRc=$LASTEXITCODE
            $resolver=Join-Path $env:RUNNER_TEMP 'resolve-p51-v3.py'
            @'
          import subprocess, pathlib, re, tempfile, sys
          def git(*args):
              return subprocess.check_output(['git',*args])
          def txt(b):
              return b.decode('utf-8-sig').replace('\r\n','\n').replace('\r','\n')
          def stage(n,p):
              return git('show',f':{n}:{p}')
          def write(p,s):
              raw=stage(2,p)
              bom=b'\xef\xbb\xbf' if raw.startswith(b'\xef\xbb\xbf') else b''
              if raw.count(b'\r\n')>raw.count(b'\n')/2: s=s.replace('\n','\r\n')
              pathlib.Path(p).write_bytes(bom+s.encode('utf-8'))
              subprocess.run(['git','add','--',p],check=True)
          def replace_method(s,signature,new):
              i=s.index(signature)
              j=s.index('{',i)
              count=1
              k=j+1
              while count:
                  count += (s[k]=='{')-(s[k]=='}')
                  k+=1
              return s[:i]+new+s[k:]
          def method(s,signature):
              i=s.index(signature); j=s.index('{',i); k=j+1; count=1
              while count:
                  count += (s[k]=='{')-(s[k]=='}'); k+=1
              return s[i:k]
          def merge_normalized(p):
              with tempfile.TemporaryDirectory() as td:
                  paths=[]
                  for n in (2,1,3):
                      f=pathlib.Path(td,str(n));f.write_bytes(txt(stage(n,p)).encode('utf-8'));paths.append(str(f))
                  cmd=['git','merge-file','-p','--diff3','-L','NEW','-L','BASE','-L','P51',*paths]
                  r=subprocess.run(cmd,capture_output=True)
                  if r.returncode<0 or r.returncode>127: raise RuntimeError(r.stderr.decode(errors='replace'))
                  return r.stdout.decode('utf-8'),r.returncode
          rx=re.compile(r'^<<<<<<< NEW\n(.*?)^\|\|\|\|\|\|\| BASE\n(.*?)^=======\n(.*?)^>>>>>>> P51\n',re.M|re.S)
          def resolve_console_block(m):
              a,b,c=m[1],m[2],m[3]
              if 'NrModeState.Serialize' in a and 'sq4kouSaveStatePurgeMs' in c:
                  return c+a
              if not a.strip() and 'SQ4KOUUIDiagnostics.InvalidateRequested();' in c:
                  return c
              if 'startupGate.GetFps' in a and 'SQ4KOU P13' in c:
                  assert a.count('Thread.Sleep(0);')==1
                  # Keep the upstream startup gate and requested FPS scheduler, but never spin on Sleep(0).
                  return a.replace('Thread.Sleep(0);','Thread.Sleep(1);')
              if 'private volatile bool wdspPreparing;' in a and 'sq4kouLastFwcStandbyMs' in c:
                  return a+c
              if 'DeferCloseForMap(e)' in a and 'P25ShutdownThetisMeters()' in c:
                  assert a.count('Direct2DDisplay.Shutdown();')==1
                  # New close guards must precede all shutdown side effects.
                  guards=a.replace('            Direct2DDisplay.Shutdown();  //v3\n','')
                  assert 'Direct2DDisplay.Shutdown' not in guards
                  return guards+c+'            Direct2DDisplay.Shutdown();  //v3\n'
              return m[0]
          def resolve_display_bytes(p):
              f=pathlib.Path(p)
              raw=f.read_bytes()
              newline=b'\r\n' if raw.count(b'\r\n')>raw.count(b'\n')/2 else b'\n'
              n=raw.replace(b'\r\n',b'\n')
              rx2=re.compile(rb'^<<<<<<< HEAD\n(.*?)^\|\|\|\|\|\|\| [^\n]*\n(.*?)^=======\n(.*?)^>>>>>>> [^\n]*\n',re.M|re.S)
              matches=list(rx2.finditer(n))
              assert len(matches)==1, 'unexpected display conflict count'
              m=matches[0]
              assert b'waterfallBitmapChanged' in m[1] and b'duration >= waterfall_update_period' in m[3]
              out=rx2.sub(lambda m:m[1].replace(b'duration > waterfall_update_period',b'duration >= waterfall_update_period'),n)
              assert b'<<<<<<< HEAD' not in out
              f.write_bytes(out.replace(b'\n',newline))
              subprocess.run(['git','add','--',p],check=True)
              print('[RESOLVED] display bytes preserved',flush=True)
          
          def resolve(p):
              if p=='Console/display.cs':
                  resolve_display_bytes(p)
                  return
              s,rc=merge_normalized(p)
              blocks=list(rx.finditer(s))
              if p=='Console/database.cs':
                  # The new WriteDatabase entry point must receive the P49 write lock,
                  # validation and atomic transaction, not bypass them.
                  if any('WriteDatabase()' not in m[1] for m in blocks): raise RuntimeError('unreviewed DB conflict')
                  s=rx.sub(lambda m:m[3],s)
                  orig=txt(stage(3,p))
                  update=method(orig,'public static void Update()')
                  lock=method(update,'lock (db_io_lock)')
                  assert all(t in lock for t in ('P49ValidateLogicalDatabase','AtomicWriteDataSet','db_io_lock'))
                  update=update.replace(lock,'WriteDatabase();',1)
                  s=replace_method(s,'public static void Update()',update)
                  s=replace_method(s,'internal static void WriteDatabase()','internal static void WriteDatabase()\n        {\n            '+lock+'\n        }')
              elif p=='Console/display.cs':
                  for m in blocks:
                      if 'waterfallBitmapChanged' not in m[1] or 'duration >= waterfall_update_period' not in m[3]:raise RuntimeError('unreviewed display conflict')
                  s=rx.sub(lambda m:m[1].replace('duration > waterfall_update_period','duration >= waterfall_update_period'),s)
              elif p=='Console/splash.Designer.cs':
                  for m in blocks:
                      if not any(t in m[3] for t in ('pnlStatus.Location','lblStatus.Location','lblTimeRemaining.Location')):raise RuntimeError('unreviewed splash layout conflict')
                  s=rx.sub(lambda m:m[3],s)
              elif p=='Console/splash.cs':
                  for m in blocks:
                      if 'pictureBox1.Visible = false;' not in m[3]:raise RuntimeError('unreviewed splash conflict')
                  s=rx.sub(lambda m:m[3],s)
              elif p=='Console/console.cs':
                  s=rx.sub(resolve_console_block,s)
              # Console: report actual conflicts after fixing newline-only mismatch.
              if rx.search(s) or '<<<<<<< NEW' in s:
                  pathlib.Path(p).write_bytes(s.encode('utf-8'))
                  print('[UNRESOLVED]',p,len(list(rx.finditer(s))),flush=True)
                  for i,m in enumerate(rx.finditer(s),1):
                      print('=== CONFLICT',i,p,'===',flush=True)
                      for label,n in [('NEW',1),('BASE',2),('P51',3)]:
                          q=m[n].splitlines()
                          print(label,len(q),'lines',flush=True)
                          print('\n'.join(q[:70]),flush=True)
                          if len(q)>70:print('... remaining lines in audit file',flush=True)
                  return
              write(p,s)
              print('[RESOLVED]',p,flush=True)
          for p in git('diff','--name-only','--diff-filter=U').decode().splitlines():
              if p in ['Console/console.cs','Console/database.cs','Console/display.cs','Console/splash.Designer.cs','Console/splash.cs']:
                  try: resolve(p)
                  except Exception as e:print('[UNRESOLVED]',p,str(e),flush=True)
          
          '@ | Set-Content -LiteralPath $resolver -Encoding utf8
            & python $resolver | Tee-Object -FilePath (Join-Path $log 'resolution.log')
            if($LASTEXITCODE -ne 0){throw 'resolver error'}
            $conflicts=@(git diff --name-only --diff-filter=U)
            $conflicts | Set-Content (Join-Path $log 'conflicts.txt')
            git status --short | Set-Content (Join-Path $log 'merge-status.txt')
            git diff --cached --stat | Set-Content (Join-Path $log 'merged-stat.txt')
            git diff --cached --binary | Out-File -FilePath (Join-Path $log 'clean-hunks.patch') -Encoding utf8
            if($conflicts.Count){
              git diff --cc | Out-File -FilePath (Join-Path $log 'conflicts.diff') -Encoding utf8
              foreach($file in $conflicts){
                $name=$file -replace '[\\/:]','_'
                $full=Join-Path $new $file
                if(Test-Path -LiteralPath $full -PathType Leaf){
                  Copy-Item -LiteralPath $full -Destination (Join-Path $log ("conflict-"+$name)) -Force
                }
              }
              Write-Host "[BLOCKED] Semantic conflict review required:"
              $conflicts | ForEach-Object {Write-Host $_}
              throw '3-way merge conflicts: not safe to publish an MSI'
            }
            $merged=(git write-tree).Trim()
            if($LASTEXITCODE -ne 0){throw 'write-tree failed'}
            git diff --cached --check | Out-File (Join-Path $log 'whitespace-audit.txt')
            Write-Host '[PASS] no remaining textual conflicts; compiler and deployment gates pending'
          } finally {Pop-Location}
          GitChecked @('read-tree','--reset','-u',$merged)
          GitChecked @('checkout','HEAD','--','.github/workflows/port-p51-v3.yml')
          $forbidden=@(git diff --cached --name-only -- WDSP DttSP Console/Direct2DDisplay.cs Console/FWC)
          if($forbidden.Count){$forbidden | Set-Content (Join-Path $log 'native-conflicts.txt');throw 'native backend changed: review required'}
          # The upstream v3 project already references vendored SharpDX 4.2.0.
          # Remove only duplicates from the old P25 package insertion, leaving
          # the upstream references and additional Desktop/Direct3D11 references.
          $proj='Console/PowerSDR.csproj'
          $xml=[IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE $proj))
          foreach($id in @('SharpDX','SharpDX.Direct2D1','SharpDX.DXGI','SharpDX.Mathematics')){
            $pattern='(?s)[ \t]*<Reference Include="'+[regex]::Escape($id)+', Version=4\.2\.0\.0,[^"]*">\s*<HintPath>\.\.\\packages\\[^<]+</HintPath>\s*</Reference>\r?\n'
            $vendored='(?s)<Reference Include="'+[regex]::Escape($id)+', Version=4\.2\.0\.0,[^"]*">\s*<HintPath>\.\.\\lib\\SharpDX\\'
            if([regex]::IsMatch($xml,$vendored)){$xml=[regex]::Replace($xml,$pattern,'')}
          }
          [IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE $proj),$xml,(New-Object Text.UTF8Encoding($false)))
          GitChecked @('add','--',$proj)
          GitChecked @('commit','-m','Integrate SQ4KOU P51 with KE9NS 3.0.0.15d; preserve native DSP and DirectX')
          $source=(git rev-parse HEAD).Trim()
          "PORT_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append
          "P51_TOOLS=$scripts" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AUDIT_DIR=$log" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$source" | Set-Content (Join-Path $log 'merged-source-sha.txt')
          GitChecked @('push','origin','HEAD:refs/heads/feature/ke9ns-v3.0.0.15d-sq4kou-p51')
      - name: Prepare pinned official legacy runtime and build tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(!(Get-Command innoextract.exe -ErrorAction SilentlyContinue) -and !(Get-Command innoextract -ErrorAction SilentlyContinue)){
            choco install innoextract -y --no-progress
            if($LASTEXITCODE -ne 0){throw 'innoextract installation failed'}
          }
          if(!(Get-Command candle.exe -ErrorAction SilentlyContinue)){
            $existing=Get-ChildItem 'C:\Program Files (x86)' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if(!$existing){
              choco install wixtoolset -y --no-progress
              if($LASTEXITCODE -ne 0){throw 'WiX installation failed'}
            }
          }
          $out=Join-Path $env:GITHUB_WORKSPACE 'bin/Release'
          # Upstream BUILDING-v3.0.0.5.md and README require the official legacy
          # hardware/application runtime. Reuse the same pinned, SHA-verified
          # extractor as the working P51 build, then rebuild DSP and frontend.
          & (Join-Path $env:P51_TOOLS 'Prepare-PowerSDR-Runtime.ps1') -WorkRoot $env:GITHUB_WORKSPACE -OutDir $out -LogRoot $env:AUDIT_DIR
          foreach($dll in @('PowerSDR.exe','DttSP.dll','PowerMate.dll','wdsp.dll')){
            $f=Join-Path $out $dll
            if(Test-Path $f){Remove-Item $f -Force}
          }
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild=& $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if(!$msbuild){throw 'MSBuild missing'}
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Compile new DttSP, PowerMate, WDSP and managed PowerSDR x86
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:GITHUB_WORKSPACE 'bin/Release'
          nuget restore PowerSDR.sln -NonInteractive
          if($LASTEXITCODE -ne 0){throw 'NuGet restore failed'}
          foreach($project in @('DttSP/DttSP.vcxproj','PowerMate/PowerMate.vcxproj')){
            $name=[IO.Path]::GetFileNameWithoutExtension($project)
            Write-Host "[BUILD] $name Win32"
            & $env:MSBUILD $project /t:Build /p:Configuration=Release /p:Platform=Win32 /p:PowerSDRPlatformToolset=v143 "/p:SolutionDir=$env:GITHUB_WORKSPACE/" /m /v:minimal "/flp:logfile=$env:AUDIT_DIR\MSBUILD_$name.log;verbosity=normal"
            if($LASTEXITCODE -ne 0){throw "$name build failed"}
          }
          & $env:MSBUILD PowerSDR.sln /t:Build /p:Configuration=Release /p:Platform=x86 /p:PowerSDRPlatformToolset=v143 "/p:ReferencePath=$out" /m /v:minimal "/flp:logfile=$env:AUDIT_DIR\MSBUILD.log;verbosity=normal" "/bl:$env:AUDIT_DIR\MSBUILD.binlog"
          if($LASTEXITCODE -ne 0){throw 'PowerSDR Release x86 failed'}
          foreach($name in @('PowerSDR.exe','PowerMate.dll','DttSP.dll','wdsp.dll','rnnoise.dll','specbleach.dll','libfftw3-3.dll','libfftw3f-3.dll','onnxruntime.dll','onnxruntime_providers_shared.dll','CATstructs.xml')){
            if(!(Test-Path (Join-Path $out $name))){throw "missing built/runtime file: $name"}
          }
          if([Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $out 'PowerSDR.exe')).FileVersion -ne '3.0.0.15'){throw 'wrong built version'}
          Write-Host "POWER_SDR_EXE_SHA256=$((Get-FileHash (Join-Path $out 'PowerSDR.exe') -Algorithm SHA256).Hash)"
      - name: Package test MSI and validate actual install
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app=Join-Path $env:GITHUB_WORKSPACE 'bin/Release'
          # Remove native development intermediates before harvesting the
          # official legacy runtime plus explicitly built application outputs.
          Get-ChildItem $app -Recurse -File -Include *.pdb,*.lib,*.exp,*.obj,*.ilk,*.map,*.pch,*.binlog,*.metagen | Remove-Item -Force
          $notices=Join-Path $env:RUNNER_TEMP 'release-notices'
          & ./tools/Collect-ReleaseNotices.ps1 -Destination $notices
          Copy-Item (Join-Path $notices 'licenses') $app -Recurse -Force
          & ./tools/Test-InstallerPayload.ps1 -PayloadPath $app -ReportPath (Join-Path $env:AUDIT_DIR 'installer-payload.json')
          $candle=Get-Command candle.exe -ErrorAction SilentlyContinue
          if(!$candle){$candle=Get-ChildItem 'C:\Program Files (x86)' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1}
          if(!$candle){throw 'WiX 3 candle missing'}
          $wix=Split-Path ($candle.Source ?? $candle.FullName) -Parent
          $w=Join-Path $env:RUNNER_TEMP 'wix-v3'
          New-Item -ItemType Directory -Force $w | Out-Null
          Push-Location $w
          try {
            & "$wix\heat.exe" dir $app -cg AppFiles -dr INSTALLFOLDER -gg -scom -sreg -sfrag -srd -var var.SourceDir -out Harvest.wxs
            if($LASTEXITCODE -ne 0){throw 'heat failed'}
            @'
          <?xml version="1.0" encoding="utf-8"?>
          <Wix xmlns="http://schemas.microsoft.com/wix/2006/wi">
            <Product Id="*" Name="PowerSDR SQ4KOU v3 Test" Language="1033" Version="3.0.15" Manufacturer="FlexRadio Systems / KE9NS / SQ4KOU" UpgradeCode="3C3A2813-0FF2-4D97-A0D3-3344F10B60A8">
              <Package InstallerVersion="500" Compressed="yes" InstallScope="perMachine" Platform="x86"/>
              <MajorUpgrade DowngradeErrorMessage="A newer test package is installed."/>
              <MediaTemplate EmbedCab="yes"/>
              <Directory Id="TARGETDIR" Name="SourceDir"><Directory Id="ProgramFilesFolder"><Directory Id="FlexRadioDir" Name="FlexRadio Systems"><Directory Id="INSTALLFOLDER" Name="PowerSDR SQ4KOU v3 Test"/></Directory></Directory></Directory>
              <Feature Id="MainFeature" Title="PowerSDR SQ4KOU" Level="1"><ComponentGroupRef Id="AppFiles"/></Feature>
            </Product>
          </Wix>
          '@ | Set-Content Product.wxs -Encoding utf8
            & "$wix\candle.exe" -arch x86 "-dSourceDir=$app" Product.wxs Harvest.wxs
            if($LASTEXITCODE -ne 0){throw 'candle failed'}
            $msi=Join-Path $env:AUDIT_DIR 'PowerSDR-SQ4KOU-FLEX5000-KE9NS-v3.0.0.15d-P51-x86.msi'
            & "$wix\light.exe" -out $msi Product.wixobj Harvest.wixobj
            if($LASTEXITCODE -ne 0){throw 'light failed'}
            $sha=(Get-FileHash -LiteralPath $msi -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sha  $(Split-Path $msi -Leaf)" | Set-Content "$msi.sha256"
            $install=Join-Path ${env:ProgramFiles(x86)} 'FlexRadio Systems/PowerSDR SQ4KOU v3 Test'
            $p=Start-Process msiexec.exe -ArgumentList @('/i',('"{0}"' -f $msi),'/qn','/norestart','/L*v',('"{0}"' -f (Join-Path $env:AUDIT_DIR 'MSI_INSTALL.log'))) -Wait -PassThru
            if($p.ExitCode -notin @(0,3010)){throw "MSI install failed: $($p.ExitCode)"}
            $exe=Join-Path $install 'PowerSDR.exe'
            if(!(Test-Path $exe) -or (Get-FileHash $exe).Hash -ne (Get-FileHash (Join-Path $app 'PowerSDR.exe')).Hash){throw 'installed exe missing or hash mismatch'}
            "SOURCE=$env:PORT_SOURCE" | Set-Content (Join-Path $env:AUDIT_DIR 'MANIFEST.txt')
            "MSI_SHA256=$sha","ARCH=x86","DSP=NEW_SOURCE_BUILD","INSTALL_HASH_MATCH=PASS","HARDWARE_TEST=NOT_PERFORMED","LEGACY_RUNTIME=OFFICIAL_PINNED_2.8.0.329","PUBLIC_RELEASE=NOT_APPROVED" | Add-Content (Join-Path $env:AUDIT_DIR 'MANIFEST.txt')
            Write-Host "MSI_SHA256=$sha"
            Write-Host '[PASS] MSI installed and executable matches compiled binary'
          } finally {Pop-Location}
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PowerSDR-v3-P51-audit-and-test
          path: port-audit/
          if-no-files-found: error
