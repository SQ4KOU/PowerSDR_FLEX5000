name: Build PowerSDR FLEX5000 P31 Modern Gadgets Container MSI

on:
  push:
    branches:
      - feature/flex5000-thetis-meters-direct-2023
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build tools
        shell: pwsh
        run: |
          if (!(Get-Command innoextract.exe -ErrorAction SilentlyContinue) -and !(Get-Command innoextract -ErrorAction SilentlyContinue)) {
            choco install innoextract -y --no-progress
          }
          if (!(Get-Command nuget.exe -ErrorAction SilentlyContinue) -and !(Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress
          }
          if (!(Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }

      - name: Locate WiX
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (!$candle) {
            $candle = Get-ChildItem 'C:\Program Files (x86)' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (!$candle) { throw 'candle.exe not found' }
          "WIXBIN=$(Split-Path $candle.Source -Parent)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build P31 MSI
        shell: pwsh
        run: |
          ./tools/powersdr/Build-PowerSDR-MSI-P31-MODERN-GADGETS-CONTAINER.ps1 -WixBin "$env:WIXBIN"

      - name: Verify P31 MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem ./artifacts/powersdr -Filter '*P31-MODERN-GADGETS-CONTAINER*.msi' -File | Select-Object -First 1
          if (!$msi) { throw 'P31 MSI artifact missing' }
          $manifest = Join-Path $msi.Directory.FullName 'POWERSDR_BUILD_MANIFEST.txt'
          if (!(Test-Path $manifest)) { throw 'P31 manifest missing' }
          $m = Get-Content $manifest -Raw
          foreach($required in @(
            'FLEX5000_BACKEND=POWERSDR_NATIVE_PAL_FWC_FIREWIRE_ASIO',
            'METERS_GADGETS=THETIS_DIRECT_2023_02_26_PLUS_MODERN_BACKPORT',
            'THETIS_GADGET_SOURCE_SHA=3dbd787eaef30eca66d089ccfb4c4ccb8c0cfb7e',
            'THETIS_CONTAINER_LOCK_SOURCE_SHA=a53b19274e715182d8f386bfabbb2c4164287a0e',
            'THETIS_GADGETS=VFO_DISPLAY,BAND_BUTTONS,MODE_BUTTONS,TUNESTEP_BUTTONS',
            'THETIS_CONTAINER_CONTROLS=LOCK,NO_TITLE_BAR_SHIFT_ACCESS',
            'THETIS_METER_PERSISTENCE=REPLACE_ALL',
            'THETIS_TX_TELEMETRY=POWERSDR_NATIVE_DTTSP_THREAD1_AND_FLEX5000_PA_FIELDS',
            'P30_BASE=UNCHANGED',
            'RX2_METER=NOT_EXPOSED',
            'FLEXMETERS_HELPER_DLL=ABSENT'
          )) {
            if(!$m.Contains($required)) { throw "Manifest gate missing: $required" }
          }
          $sha = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLowerInvariant()
          "MSI=$($msi.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SHA256=$sha" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "P31=P30 + modern Thetis VFO/BAND/MODE/STEP + Lock/No Title Bar" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload P31 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerSDR-FLEX5000-P31-MODERN-GADGETS-CONTAINER
          path: |
            artifacts/powersdr/*.msi
            artifacts/powersdr/*.sha256
            artifacts/powersdr/POWERSDR_BUILD_MANIFEST.txt
            artifacts/powersdr/logs/**
          if-no-files-found: error
