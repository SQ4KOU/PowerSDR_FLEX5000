name: Build PowerSDR FLEX5000 P29 Meter Skins Fix MSI

on:
  push:
    branches:
      - feature/flex5000-thetis-meters-direct-2023
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build tools
        shell: pwsh
        run: |
          if (!(Get-Command innoextract.exe -ErrorAction SilentlyContinue) -and !(Get-Command innoextract -ErrorAction SilentlyContinue)) {
            choco install innoextract -y --no-progress
          }
          if (!(Get-Command nuget.exe -ErrorAction SilentlyContinue) -and !(Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress
          }
          if (!(Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }

      - name: Locate WiX
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (!$candle) {
            $candle = Get-ChildItem 'C:\Program Files (x86)' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (!$candle) { throw 'candle.exe not found' }
          $path = Split-Path $candle.Source -Parent
          "WIXBIN=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build P29 MSI
        shell: pwsh
        run: |
          ./tools/powersdr/Build-PowerSDR-MSI-P29-METER-SKINS-FIX.ps1 -WixBin "$env:WIXBIN"

      - name: Verify P29 MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem ./artifacts/powersdr -Filter '*P29-METER-SKINS-FIX*.msi' -File | Select-Object -First 1
          if (!$msi) { throw 'P29 MSI artifact missing' }
          $manifest = Join-Path $msi.Directory.FullName 'POWERSDR_BUILD_MANIFEST.txt'
          if (!(Test-Path $manifest)) { throw 'P29 manifest missing' }
          $m = Get-Content $manifest -Raw
          foreach($required in @(
            'FLEX5000_BACKEND=POWERSDR_NATIVE_PAL_FWC_FIREWIRE_ASIO',
            'METERS_GADGETS=THETIS_DIRECT_2023_02_26',
            'THETIS_METER_RENDERER=SHARPDX_NATIVE',
            'THETIS_METER_PERSISTENCE=REPLACE_ALL',
            'THETIS_METER_SKINS=OFFICIAL_DEFAULT_METERS',
            'THETIS_METER_SKIN_SOURCE=ramdor/ThetisSkins@601018a9486359b3bdb661063f4687b4c75ad917',
            'THETIS_METER_SKIN_ASSETS=ananMM,ananMM-bg,ananMM-bg-tx,cross-needle,cross-needle-bg',
            'RX2_METER=NOT_EXPOSED',
            'FLEXMETERS_HELPER_DLL=ABSENT'
          )) {
            if(!$m.Contains($required)) { throw "Manifest gate missing: $required" }
          }
          $sha = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLowerInvariant()
          "MSI=$($msi.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SHA256=$sha" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "P29=P28 unchanged + official Thetis Default Meters skin assets" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload P29 artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerSDR-FLEX5000-P29-METER-SKINS-FIX
          path: |
            artifacts/powersdr/*.msi
            artifacts/powersdr/*.sha256
            artifacts/powersdr/POWERSDR_BUILD_MANIFEST.txt
            artifacts/powersdr/logs/**
          if-no-files-found: error
