name: Build PowerSDR FLEX5000 KE9NS 2.8.0.336 P21 FINAL3 SQ4KOU SPLASH MSI

on:
  push:
    branches:
      - feature/ke9ns-2.8.0.336-p21-final3-sq4kou-splash
  pull_request:
    branches:
      - feature/ke9ns-2.8.0.336-p20-original-flex-splash
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build tools
        shell: pwsh
        run: |
          if (!(Get-Command innoextract.exe -ErrorAction SilentlyContinue) -and !(Get-Command innoextract -ErrorAction SilentlyContinue)) {
            choco install innoextract -y --no-progress
          }
          if (!(Get-Command nuget.exe -ErrorAction SilentlyContinue) -and !(Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress
          }
          if (!(Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }

      - name: Locate WiX
        id: wix
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (!$candle) {
            $candle = Get-ChildItem 'C:\Program Files (x86)' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (!$candle) { throw 'candle.exe not found' }
          $path = Split-Path $candle.Source -Parent
          "WIXBIN=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build P21 FINAL3 MSI
        shell: pwsh
        run: |
          ./tools/powersdr/Build-PowerSDR-MSI-P21-FINAL3.ps1 -WixBin "$env:WIXBIN"

      - name: Verify P21 FINAL3 MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem ./artifacts/powersdr -Filter '*P21-FINAL3-SQ4KOU-SPLASH*.msi' -File | Select-Object -First 1
          if (!$msi) { throw 'P21 FINAL3 SQ4KOU splash MSI artifact missing' }
          $sha = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLowerInvariant()
          "MSI=$($msi.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SHA256=$sha" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "BASE=KE9NS 2.8.0.336 / P20 startup baseline" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "P21 FINAL3=approved SQ4KOU 600x384 splash; exact bytes SHA-gated; dynamic progress/status preserved; reveal-before-audio preserved" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload P21 FINAL3 MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: PowerSDR-FLEX5000-KE9NS-2.8.0.336-P21-FINAL3-SQ4KOU-SPLASH
          path: |
            artifacts/powersdr/*.msi
            artifacts/powersdr/*.sha256
            artifacts/powersdr/POWERSDR_BUILD_MANIFEST.txt
            artifacts/powersdr/logs/**
          if-no-files-found: error
