name: PowerSDR KE9NS 2.8.0.336 P05 audio-before-FWC audit

on:
  push:
    branches:
      - feature/ke9ns-2.8.0.336-p05-audio-before-fwc-standby
  workflow_dispatch:

jobs:
  db-source-audit:
    runs-on: windows-latest
    steps:
      - name: Checkout SQ4KOU harness
        uses: actions/checkout@v4

      - name: Fetch clean KE9NS 2.8.0.336
        shell: pwsh
        run: |
          git clone --no-tags https://github.com/ke9ns/PowerSDR-KE9NS-v2.8.0.git _audit_source
          Push-Location _audit_source
          git checkout --detach d558979570c4c2e4572b63ac218d3d4477926cb8
          if ((git rev-parse HEAD).Trim() -ne 'd558979570c4c2e4572b63ac218d3d4477926cb8') {
            throw 'KE9NS 2.8.0.336 source pin mismatch'
          }
          Pop-Location

      - name: Apply P02 reliability patches
        shell: pwsh
        run: |
          ./tools/powersdr/Apply-PowerSDR-DatabaseReliability.ps1 -SourceRoot ./_audit_source
          ./tools/powersdr/Apply-PowerSDR-WindowState.ps1 -SourceRoot ./_audit_source
          ./tools/powersdr/Apply-PowerSDR-FastShutdown.ps1 -SourceRoot ./_audit_source
          ./tools/powersdr/Apply-PowerSDR-FastAudioExit.ps1 -SourceRoot ./_audit_source
          ./tools/powersdr/Apply-PowerSDR-AudioBeforeStandby.ps1 -SourceRoot ./_audit_source

      - name: Enforce P02 boundary
        shell: pwsh
        run: |
          Push-Location _audit_source
          $changed = @(git diff --name-only | Sort-Object)
          $expected = @('Console/audio.cs','Console/console.cs','Console/database.cs')
          if ($changed.Count -ne 3 -or (Compare-Object $expected $changed)) {
            throw ('P02 patch escaped boundary. Changed files: ' + ($changed -join ', '))
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

          $db = [IO.File]::ReadAllText((Resolve-Path 'Console/database.cs'))
          $required = @(
            'private static void AtomicWriteDataSet',
            'FileOptions.WriteThrough',
            'System.Xml.XmlReader.Create(temp, verifySettings)',
            'temporary XML file is empty',
            'File.Replace(temp, destination, null)',
            'TryLoadFirstValidBackup',
            'DatabaseSiblingPath("_bak3")',
            'PreserveCorruptDatabase(file_name)',
            'The original file was left unchanged'
          )
          foreach ($token in $required) {
            if (!$db.Contains($token)) { throw ('Required DB hardening marker missing: ' + $token) }
          }

          $forbidden = @(
            'ds.WriteXml(file_name, XmlWriteMode.WriteSchema)',
            'ds.ReadXml(recovery_db)'
          )
          foreach ($token in $forbidden) {
            if ($db.Contains($token)) { throw ('Unsafe legacy DB path still present: ' + $token) }
          }

          $console = [IO.File]::ReadAllText((Resolve-Path 'Console/console.cs'))
          $audio = [IO.File]::ReadAllText((Resolve-Path 'Console/audio.cs'))
          foreach ($token in @(
            'consoleBoundsToSave',
            'this.RestoreBounds',
            'this.WindowState = FormWindowState.Maximized;',
            '500 - (int)shutdownJoinWatch.ElapsedMilliseconds',
            'SQ4KOU_SHUTDOWN1_TOTAL_MS=',
            'SQ4KOU_SHUTDOWN2_TOTAL_MS=',
            'SQ4KOU_SHUTDOWN3_TOTAL_MS='
          )) {
            if (!$console.Contains($token)) { throw ('Required window-state marker missing: ' + $token) }
          }

          foreach ($audioToken in @(
            'public static bool FastApplicationShutdown',
            'SQ4KOU P04 FAST APPLICATION ASIO EXIT',
            'PA19.PA_AbortStream(stream1)',
            'SQ4KOU P04 FAST APPLICATION VAC EXIT',
            'SQ4KOU P04 FAST APPLICATION VAC2 EXIT'
          )) {
            if (!$audio.Contains($audioToken)) { throw ('Required P04 audio marker missing: ' + $audioToken) }
          }
          if (!$console.Contains('Audio.FastApplicationShutdown = true;')) {
            throw 'Console does not enable P04 fast audio exit before Power OFF'
          }
          foreach ($p05Token in @(
            'SQ4KOU P05: on application close only, stop FireWire/ASIO first.',
            'Stopwatch sq4kouFwcStandbyTimer = Stopwatch.StartNew();',
            'SQ4KOU_POWER_OFF_PHASE_MS=',
            'SQ4KOU_FWC_STANDBY_MS='
          )) {
            if (!$console.Contains($p05Token)) { throw ('Required P05 marker missing: ' + $p05Token) }
          }

          foreach ($forbiddenToken in @('draw_display_thread.Join(500)','poll_ptt_thread.Join(500)')) {
            if ($console.Contains($forbiddenToken)) { throw ('Legacy cumulative shutdown wait still present: ' + $forbiddenToken) }
          }

          $native = @(
            'Console/FWC/fwc.cs',
            'Console/FWC/pal.cs',
            'Console/portaudio.cs',
            'Console/display.cs',
            'DttSP/fm_demod.c',
            'DttSP/update.c'
          )
          foreach ($path in $native) {
            $status = (git status --porcelain -- $path)
            if ($status) { throw ('Native non-DB source changed unexpectedly: ' + $path) }
          }
          Pop-Location

      - name: Summary
        shell: pwsh
        run: |
          'BASE=KE9NS_2.8.0.336' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'SOURCE_SHA=d558979570c4c2e4572b63ac218d3d4477926cb8' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'PATCH_SCOPE=Console/database.cs + Console/console.cs + Console/audio.cs only' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'DB_IO=atomic write + streaming XML verification + validated backup fallback' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'WINDOW_STATE=Maximized + RestoreBounds persistence' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'SHUTDOWN=global 500ms worker budget + redundant sleep removal + timing logs' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'AUDIO_EXIT=terminal PA_AbortStream for ASIO/VAC only; native normal Stop/Start preserved' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          'P05_ORDER=terminal close stops audio before synchronous FWC standby + timing markers' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
