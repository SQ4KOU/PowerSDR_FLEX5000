name: FlexMeters RX1 + TX native adapter

on:
  push:
    branches:
      - feature/flex5000-thetis-meters-gadgets-1to1
    paths:
      - 'tools/powersdr/meters-native/FlexMeters/**'
      - 'tools/powersdr/meters-native/FlexMeters.Tests/**'
      - 'tools/powersdr/meters-native/PowerSDR/**'
      - 'tools/powersdr/Apply-PowerSDR-FlexMeters-RX1.ps1'
      - 'tools/powersdr/Verify-PowerSDR-FlexMeters-RX1.ps1'
      - 'tools/powersdr/Test-PowerSDR-FlexMeters-RX1.ps1'
      - '.github/workflows/flexmeters-rx1-adapter-tests.yml'
  workflow_dispatch:

jobs:
  rx1-tx-native-adapter:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure tools
        shell: pwsh
        run: |
          if (!(Get-Command innoextract.exe -ErrorAction SilentlyContinue) -and !(Get-Command innoextract -ErrorAction SilentlyContinue)) {
            choco install innoextract -y --no-progress
          }
          if (!(Get-Command nuget.exe -ErrorAction SilentlyContinue) -and !(Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress
          }

      - name: Run RX1 + TX integration gate
        shell: pwsh
        run: ./tools/powersdr/Test-PowerSDR-FlexMeters-RX1.ps1
