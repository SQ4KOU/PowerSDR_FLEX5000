name: Build PowerSDR FLEX5000 P24 Native Thetis Meters

on:
  push:
    branches:
      - feature/flex5000-thetis-meters-gadgets-1to1
  pull_request:
    branches:
      - feature/flex5000-thetis-meters-gadgets-1to1
  workflow_dispatch:

concurrency:
  group: p24-native-thetis-meters-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native-p24:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build tools
        shell: pwsh
        run: |
          if (!(Get-Command innoextract.exe -ErrorAction SilentlyContinue) -and !(Get-Command innoextract -ErrorAction SilentlyContinue)) {
            choco install innoextract -y --no-progress
          }
          if (!(Get-Command nuget.exe -ErrorAction SilentlyContinue) -and !(Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress
          }
          if (!(Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }

      - name: Locate WiX
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (!$candle) {
            $candle = Get-ChildItem 'C:\Program Files (x86)' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (!$candle) { throw 'candle.exe not found' }
          $path = Split-Path $candle.Source -Parent
          "WIXBIN=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Roslyn syntax diagnostics
        shell: pwsh
        run: |
          $roslynDir = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Recurse -Filter Microsoft.CodeAnalysis.CSharp.dll -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.DirectoryName 'Microsoft.CodeAnalysis.dll') } |
            Select-Object -First 1 -ExpandProperty DirectoryName
          if (!$roslynDir) { throw 'Roslyn assemblies not found' }
          [void][Reflection.Assembly]::LoadFrom((Join-Path $roslynDir 'Microsoft.CodeAnalysis.dll'))
          [void][Reflection.Assembly]::LoadFrom((Join-Path $roslynDir 'Microsoft.CodeAnalysis.CSharp.dll'))
          $src = [IO.File]::ReadAllText('tools/powersdr/P24SetupNativeMeters.cs')
          $tree = [Microsoft.CodeAnalysis.CSharp.CSharpSyntaxTree]::ParseText($src)
          Write-Host '--- ROSLYN DIAGNOSTICS ---'
          foreach($d in $tree.GetDiagnostics()) { Write-Host $d.ToString() }
          Write-Host '--- MISSING TOKENS ---'
          foreach($t in $tree.GetRoot().DescendantTokens()) {
            if($t.IsMissing) {
              $lp=$t.GetLocation().GetLineSpan()
              Write-Host ("MISSING kind={0} line={1} col={2} span={3}" -f $t.Kind(),($lp.StartLinePosition.Line+1),($lp.StartLinePosition.Character+1),$t.SpanStart)
            }
          }

      - name: Build P24 native Thetis meters
        shell: pwsh
        run: |
          ./tools/powersdr/Build-PowerSDR-MSI-P24-NATIVE-THETIS-METERS.ps1 -WixBin "$env:WIXBIN"

      - name: Upload diagnostics or MSI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PowerSDR-P24-NATIVE-THETIS-METERS
          path: |
            artifacts/powersdr/**
            .work/powersdr-ke9ns/Console/P24_*.cs
            .work/powersdr-ke9ns/Console/P24Thetis*.cs
            .work/powersdr-ke9ns/Console/P24SetupNativeMeters.cs
            .work/powersdr-ke9ns/Console/PowerSDR.csproj
          if-no-files-found: warn
