name: Build PowerSDR FLEX5000 P22 Native Thetis RX1 Stage1 MSI

on:
  push:
    branches:
      - feature/flex5000-thetis-meter-native-stage1
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure build tools
        shell: pwsh
        run: |
          if (!(Get-Command innoextract.exe -ErrorAction SilentlyContinue) -and !(Get-Command innoextract -ErrorAction SilentlyContinue)) {
            choco install innoextract -y --no-progress
          }
          if (!(Get-Command nuget.exe -ErrorAction SilentlyContinue) -and !(Get-Command nuget -ErrorAction SilentlyContinue)) {
            choco install nuget.commandline -y --no-progress
          }
          if (!(Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }

      - name: Locate WiX
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if (!$candle) {
            $candle = Get-ChildItem 'C:\Program Files (x86)' -Recurse -Filter candle.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (!$candle) { throw 'candle.exe not found' }
          $path = Split-Path $candle.Source -Parent
          "WIXBIN=$path" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build P22 physical-test MSI
        shell: pwsh
        run: |
          ./tools/powersdr/Build-PowerSDR-MSI.ps1 -WixBin "$env:WIXBIN"

      - name: Verify P22 artifact and physical-validation boundary
        shell: pwsh
        run: |
          $msi = Get-ChildItem ./artifacts/powersdr -Filter '*P22-THETIS-RX1-STAGE1*.msi' -File | Select-Object -First 1
          if (!$msi) { throw 'P22 MSI artifact missing' }
          $manifest = Get-Content ./artifacts/powersdr/POWERSDR_BUILD_MANIFEST.txt -Raw
          foreach($token in @(
            'METER_STAGE1=THETIS_NATIVE_BORDERLESS_CONTAINER_POWERSDR_DB_PERSISTENCE_FLEX5000_RX1_ONLY',
            'METER_TELEMETRY=KE9NS_NATIVE_SIGNAL_STRENGTH_CAL_PATH',
            'METER_PHYSICAL_VALIDATION=PENDING',
            'RX2_METER=ABSENT',
            'FLEXMETERS_HELPER_DLL=ABSENT'
          )){
            if(!$manifest.Contains($token)){ throw "Manifest gate missing: $token" }
          }
          $sha = (Get-FileHash -Algorithm SHA256 $msi.FullName).Hash.ToLowerInvariant()
          "MSI=$($msi.Name)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "SHA256=$sha" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "BASE=fad6179 safe/P21" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "P22=compile/architecture gates only; physical PASS pending FLEX-5000 log" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload P22 physical-test package
        uses: actions/upload-artifact@v4
        with:
          name: PowerSDR-FLEX5000-P22-THETIS-RX1-STAGE1
          path: |
            artifacts/powersdr/*.msi
            artifacts/powersdr/*.sha256
            artifacts/powersdr/POWERSDR_BUILD_MANIFEST.txt
            artifacts/powersdr/logs/**
          if-no-files-found: error
